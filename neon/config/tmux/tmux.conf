# NEON // shared tmux controls. See docs/TERMINAL.md.
# tmux 3.2+; keep one tmux server inside the Linux/macOS environment.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -sg escape-time 0
set -g focus-events on
set -g history-limit 30000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off

# Preserve Helder's Ctrl-a prefix and hjkl muscle memory.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind z resize-pane -Z
bind r source-file "$HOME/.config/neon/root/config/tmux/tmux.conf" \; display-message "NEON // configuration reloaded"
bind f new-window -n projects -c "#{pane_current_path}" "tmux-sessionizer"
bind D new-window -n notes -c "#{pane_current_path}" "nvim TODO.md"

# Explicit clipboard endpoint; no automatic OSC52 writes to outer terminals.
set -s set-clipboard off
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "neon-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "neon-copy"
bind -T copy-mode-vi Escape send-keys -X cancel

# Format strings only: no shell processes on every status refresh.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#090e17,fg=#8c97af"
set -g status-left-length 45
set -g status-right-length 60
set -g status-left "#[fg=#090e17,bg=#47ebff,bold] NEON #[default] #[fg=#d6e1ff]#S "
set -g status-right "#[fg=#ff72d5]#{?client_prefix, COMMAND ,}#[fg=#47ebff]#{?window_zoomed_flag, ZOOM ,}#[fg=#8c97af] #{pane_current_command} #[fg=#f5f570]%H:%M "
setw -g window-status-format " #[fg=#8c97af]#I:#W "
setw -g window-status-current-format "#[fg=#090e17,bg=#f5f570,bold] #I:#W #[default]"
setw -g window-status-separator ""
set -g pane-border-style "fg=#344568"
set -g pane-active-border-style "fg=#47ebff"
set -g message-style "bg=#344568,fg=#f5f570"
set -g mode-style "bg=#344568,fg=#f5f570"
set -g display-panes-active-colour "#f5f570"
set -g display-panes-colour "#47ebff"
